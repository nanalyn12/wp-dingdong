<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1540" viewBox="0 0 1160 1540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1160" height="1540" fill="#f8fafc"/>

  <!-- ===================== 제목 ===================== -->
  <rect x="0" y="0" width="1160" height="92" fill="url(#hdr)"/>
  <text x="40" y="42" font-size="26" font-weight="700" fill="#ffffff">DingDong LMS — TDD + Harness Engineering 개발 흐름</text>
  <text x="40" y="72" font-size="15" fill="#c7d2fe">WordPress Studio (Playground / PHP-WASM) · 커스텀 플러그인 dingdong-lms · 의존성 없는 PHP 테스트 러너</text>

  <!-- 기술 스택 배지 -->
  <g font-size="13" font-weight="600">
    <rect x="800" y="24" width="92" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
    <text x="846" y="42" fill="#ffffff" text-anchor="middle">Claude Code</text>
    <rect x="900" y="24" width="82" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
    <text x="941" y="42" fill="#ffffff" text-anchor="middle">WordPress</text>
    <rect x="990" y="24" width="62" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
    <text x="1021" y="42" fill="#ffffff" text-anchor="middle">PHP 8.5</text>
    <rect x="1060" y="24" width="62" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
    <text x="1091" y="42" fill="#ffffff" text-anchor="middle">SQLite</text>
  </g>

  <!-- ===================== 단계 구분 라벨 ===================== -->
  <g font-size="13" font-weight="700" letter-spacing="1">
    <text x="40" y="150" fill="#1e3a8a">PHASE 1 — 컨텍스트 확보</text>
    <text x="40" y="530" fill="#b45309">PHASE 2 — TDD 사이클</text>
    <text x="40" y="1000" fill="#0f766e">PHASE 3 — 검증 게이트</text>
  </g>
  <line x1="40" y1="160" x2="1120" y2="160" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="540" x2="1120" y2="540" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="1010" x2="1120" y2="1010" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===================== PHASE 1 ===================== -->

  <!-- 요청 -->
  <rect x="330" y="180" width="360" height="52" rx="26" fill="#1e293b"/>
  <text x="510" y="212" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">요청 (Requirement)</text>
  <line x1="510" y1="232" x2="510" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1. 규칙 확인 -->
  <rect x="290" y="264" width="440" height="72" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <circle cx="320" cy="300" r="15" fill="#1e3a8a"/>
  <text x="320" y="306" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="348" y="294" font-size="16" font-weight="700" fill="#0f172a">Harness 규칙 확인</text>
  <text x="348" y="318" font-size="13" fill="#475569">CLAUDE.md (절차) · AGENTS.md (도메인 19개 규칙)</text>
  <rect x="770" y="272" width="330" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="786" y="294" font-size="12.5" fill="#1e3a8a">Core 수정 금지 · 배포 모델 보존 · 간체자 통일</text>
  <text x="786" y="314" font-size="12.5" fill="#1e3a8a">TTS 중국어 전용 · 마크다운 기호 비표시</text>
  <line x1="510" y1="336" x2="510" y2="366" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. 코드베이스 분석 -->
  <rect x="290" y="368" width="440" height="72" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <circle cx="320" cy="404" r="15" fill="#1e3a8a"/>
  <text x="320" y="410" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="348" y="398" font-size="16" font-weight="700" fill="#0f172a">코드베이스 · 기존 테스트 분석</text>
  <text x="348" y="422" font-size="13" fill="#475569">includes/ · public/ · tests/unit/ 에서 현재 동작 파악</text>
  <line x1="510" y1="440" x2="510" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. 변경 범위 정의 -->
  <rect x="290" y="472" width="440" height="52" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <circle cx="320" cy="498" r="15" fill="#1e3a8a"/>
  <text x="320" y="504" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="348" y="504" font-size="15" font-weight="600" fill="#0f172a">변경 범위 정의 — 건드리지 않을 것도 함께 정의</text>
  <line x1="510" y1="524" x2="510" y2="566" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== PHASE 2 — TDD ===================== -->

  <rect x="256" y="562" width="508" height="386" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>

  <!-- 4. 테스트 작성 -->
  <rect x="290" y="586" width="440" height="52" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <circle cx="320" cy="612" r="15" fill="#b45309"/>
  <text x="320" y="618" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="348" y="618" font-size="15" font-weight="600" fill="#0f172a">테스트 먼저 작성 — tests/unit/*.test.php</text>
  <line x1="510" y1="638" x2="510" y2="664" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. RED -->
  <rect x="290" y="666" width="440" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="320" cy="694" r="15" fill="#dc2626"/>
  <text x="320" y="700" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="348" y="690" font-size="16" font-weight="700" fill="#991b1b">RED — 실제로 실패하는지 눈으로 확인</text>
  <text x="348" y="710" font-size="12.5" fill="#b91c1c">건너뛰면 "항상 통과하는 가짜 테스트"가 된다</text>
  <line x1="510" y1="722" x2="510" y2="748" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. 최소 구현 -->
  <rect x="290" y="750" width="440" height="52" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <circle cx="320" cy="776" r="15" fill="#b45309"/>
  <text x="320" y="782" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="348" y="782" font-size="15" font-weight="600" fill="#0f172a">최소 구현 — 테스트를 통과시킬 만큼만</text>
  <line x1="510" y1="802" x2="510" y2="828" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. GREEN -->
  <rect x="290" y="830" width="440" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="320" cy="856" r="15" fill="#16a34a"/>
  <text x="320" y="862" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="348" y="862" font-size="16" font-weight="700" fill="#166534">GREEN — php tests/run.php</text>
  <line x1="510" y1="882" x2="510" y2="908" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. Refactor -->
  <rect x="290" y="910" width="440" height="52" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <circle cx="320" cy="936" r="15" fill="#b45309"/>
  <text x="320" y="942" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
  <text x="348" y="942" font-size="15" font-weight="600" fill="#0f172a">Refactor — 테스트를 GREEN 으로 유지한 채</text>

  <!-- 되돌아가는 루프 -->
  <path d="M 290 936 L 210 936 Q 190 936 190 916 L 190 632 Q 190 612 210 612 L 290 612"
        fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowLoop)"/>
  <rect x="46" y="748" width="128" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="110" y="772" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">요구사항마다</text>
  <text x="110" y="792" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">사이클 반복</text>

  <!-- TDD 우측 주석 -->
  <rect x="800" y="620" width="300" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="820" y="648" font-size="14" font-weight="700" fill="#0f172a">테스트 계층에서 검증 가능한 것</text>
  <text x="820" y="674" font-size="12.5" fill="#166534">✓ 번체→간체 변환 (DD_Chinese)</text>
  <text x="820" y="696" font-size="12.5" fill="#166534">✓ 마크다운 렌더링 · 기호 비표시</text>
  <text x="820" y="718" font-size="12.5" fill="#166534">✓ TTS 한글 제거 (chinese_only)</text>
  <text x="820" y="740" font-size="12.5" fill="#166534">✓ 자격증명 해석 순서 (DD_Env)</text>

  <text x="820" y="782" font-size="14" font-weight="700" fill="#0f172a">Studio 사이트에서 수동 확인</text>
  <text x="820" y="808" font-size="12.5" fill="#9a3412">△ WP_Query · $wpdb · 훅 · REST 권한</text>
  <text x="820" y="830" font-size="12.5" fill="#9a3412">△ DOM / CSS / 글라스모피즘 UI</text>
  <text x="820" y="852" font-size="12.5" fill="#9a3412">△ Web Speech · YouTube IFrame API</text>
  <text x="820" y="874" font-size="12.5" fill="#9a3412">△ Gemini · Pixabay · Suno 실제 응답</text>
  <text x="820" y="896" font-size="12" fill="#64748b">※ preview 서버 기동 금지 — Studio 사용</text>

  <line x1="510" y1="962" x2="510" y2="1036" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== PHASE 3 — 검증 게이트 ===================== -->

  <rect x="140" y="1038" width="880" height="238" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="170" y="1072" font-size="17" font-weight="700" fill="#0f766e">9  검증 게이트 — php tests/verify.php</text>
  <text x="170" y="1094" font-size="12.5" fill="#475569">네 단계 중 하나라도 실패하면 종료 코드 1 — "고쳤다"는 보고는 이 게이트를 통과한 뒤에만 가능하다</text>

  <g>
    <rect x="170" y="1112" width="196" height="140" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="268" y="1140" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">1. PHP 구문</text>
    <text x="268" y="1166" font-size="12.5" fill="#475569" text-anchor="middle">php -l</text>
    <text x="268" y="1192" font-size="12.5" fill="#475569" text-anchor="middle">플러그인 + 테마</text>
    <text x="268" y="1218" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">37 파일</text>
    <text x="268" y="1240" font-size="12" fill="#16a34a" text-anchor="middle">PASS</text>

    <rect x="382" y="1112" width="196" height="140" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="480" y="1140" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">2. JS 구문</text>
    <text x="480" y="1166" font-size="12.5" fill="#475569" text-anchor="middle">node --check</text>
    <text x="480" y="1192" font-size="12.5" fill="#475569" text-anchor="middle">public/js</text>
    <text x="480" y="1218" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">19 파일</text>
    <text x="480" y="1240" font-size="12" fill="#16a34a" text-anchor="middle">PASS</text>

    <rect x="594" y="1112" width="196" height="140" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="692" y="1140" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">3. 자격증명 스캔</text>
    <text x="692" y="1166" font-size="12.5" fill="#475569" text-anchor="middle">하드코딩 키 탐지</text>
    <text x="692" y="1192" font-size="12.5" fill="#475569" text-anchor="middle">AIza / sk- / ghp_ …</text>
    <text x="692" y="1218" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">0 건</text>
    <text x="692" y="1240" font-size="12" fill="#16a34a" text-anchor="middle">PASS</text>

    <rect x="806" y="1112" width="196" height="140" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="904" y="1140" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">4. 단위 테스트</text>
    <text x="904" y="1166" font-size="12.5" fill="#475569" text-anchor="middle">tests/run.php</text>
    <text x="904" y="1192" font-size="12.5" fill="#475569" text-anchor="middle">68 통과 · 4 건너뜀</text>
    <text x="904" y="1218" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">72 건</text>
    <text x="904" y="1240" font-size="12" fill="#16a34a" text-anchor="middle">PASS</text>
  </g>

  <line x1="510" y1="1276" x2="510" y2="1310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 10. Git Diff -->
  <rect x="290" y="1312" width="440" height="72" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <circle cx="320" cy="1348" r="15" fill="#0f766e"/>
  <text x="320" y="1354" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
  <text x="348" y="1342" font-size="16" font-weight="700" fill="#0f172a">Git Diff 검토 — git status / git diff</text>
  <text x="348" y="1366" font-size="12.5" fill="#475569">Core 유입 · .env 추적 · 자격증명 노출 · 범위 초과 확인</text>
  <rect x="770" y="1320" width="330" height="56" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="786" y="1342" font-size="12.5" fill="#0f766e">허용목록 .gitignore — 커스텀 코드만 추적</text>
  <text x="786" y="1362" font-size="12.5" fill="#0f766e">WordPress Core · uploads · .env 는 제외</text>

  <line x1="510" y1="1384" x2="510" y2="1414" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DONE -->
  <rect x="330" y="1416" width="360" height="56" rx="28" fill="#0f766e"/>
  <text x="510" y="1452" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">DONE</text>

  <text x="40" y="1508" font-size="12" fill="#94a3b8">코드를 빨리 쓰는 것보다, 기존 동작을 깨뜨리지 않고 검증 가능한 방식으로 바꾸는 것을 우선한다.</text>
</svg>
