<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dingdong — 墨花 Ink & Blossom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-dark-plum: #2D2226;
            --color-soft-blush: #FFDBDA;
            --color-old-rose: #DB7F8E;
            --color-fairy-floss: #EBCCC5;
            --color-pale-slate: #D5C5C8;
            --content-size: 800px;
            --wide-size: 1280px;
            --font-display: 'Cormorant Garamond', serif;
            --font-korean: 'Noto Sans KR', sans-serif;
            --font-chinese: 'Noto Sans TC', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-dark-plum);
            color: var(--color-soft-blush);
            font-family: var(--font-korean);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Grain texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.5rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: var(--wide-size);
            margin: 0 auto;
            animation: fadeDown 1s ease-out 0.2s both;
        }

        .header-logo {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--color-soft-blush);
            letter-spacing: 0.02em;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .header-logo:hover {
            opacity: 0.8;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .header-nav a {
            font-family: var(--font-korean);
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--color-pale-slate);
            text-decoration: none;
            letter-spacing: 0.01em;
            position: relative;
            transition: color 0.3s ease;
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--color-old-rose);
            transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .header-nav a:hover {
            color: var(--color-soft-blush);
        }

        .header-nav a:hover::after {
            width: 100%;
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        /* Floating blossoms / lanterns */
        .blossom {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: drift 20s infinite ease-in-out;
            pointer-events: none;
        }

        .blossom-1 {
            width: 320px;
            height: 320px;
            background: radial-gradient(ellipse at center, rgba(219, 127, 142, 0.08) 0%, transparent 70%);
            top: 10%;
            left: -5%;
            animation-delay: 0s;
            animation-duration: 25s;
        }

        .blossom-2 {
            width: 200px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(255, 219, 218, 0.06) 0%, transparent 70%);
            top: 60%;
            right: 5%;
            animation-delay: -5s;
            animation-duration: 22s;
        }

        .blossom-3 {
            width: 150px;
            height: 150px;
            background: radial-gradient(ellipse at center, rgba(235, 204, 197, 0.07) 0%, transparent 70%);
            top: 25%;
            right: 15%;
            animation-delay: -10s;
            animation-duration: 28s;
        }

        .blossom-4 {
            width: 250px;
            height: 250px;
            background: radial-gradient(ellipse at center, rgba(219, 127, 142, 0.05) 0%, transparent 70%);
            bottom: 15%;
            left: 10%;
            animation-delay: -7s;
            animation-duration: 30s;
        }

        .blossom-5 {
            width: 100px;
            height: 100px;
            background: radial-gradient(ellipse at center, rgba(255, 219, 218, 0.09) 0%, transparent 70%);
            top: 45%;
            left: 25%;
            animation-delay: -12s;
            animation-duration: 18s;
        }

        .blossom-6 {
            width: 180px;
            height: 180px;
            background: radial-gradient(ellipse at center, rgba(213, 197, 200, 0.06) 0%, transparent 70%);
            bottom: 30%;
            right: 20%;
            animation-delay: -3s;
            animation-duration: 24s;
        }

        /* Ink wash gradient atmosphere */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 50%, rgba(45, 34, 38, 0) 0%, var(--color-dark-plum) 100%),
                radial-gradient(ellipse at 20% 80%, rgba(219, 127, 142, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(235, 204, 197, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: var(--content-size);
            padding: 2rem;
        }

        .hero-headline {
            font-family: var(--font-korean);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            color: var(--color-soft-blush);
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            animation: fadeUp 1s ease-out 0.5s both;
        }

        .hero-subtext {
            font-family: var(--font-korean);
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: 300;
            color: var(--color-pale-slate);
            line-height: 1.7;
            margin-bottom: 3rem;
            animation: fadeUp 1s ease-out 0.8s both;
        }

        .hero-cta {
            display: inline-block;
            font-family: var(--font-korean);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--color-dark-plum);
            background-color: var(--color-old-rose);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            letter-spacing: 0.02em;
            transition:
                transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.3s ease,
                background-color 0.3s ease;
            animation: fadeUp 1s ease-out 1.1s both;
            box-shadow: 0 4px 24px rgba(219, 127, 142, 0.2);
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(219, 127, 142, 0.35);
            background-color: #e08a99;
        }

        .hero-cta:active {
            transform: translateY(0);
        }

        /* Decorative ink brushstroke accent */
        .hero-accent {
            display: block;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-old-rose), transparent);
            margin: 0 auto 2rem;
            opacity: 0.6;
            animation: fadeUp 1s ease-out 0.4s both;
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes drift {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(1);
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: translate(30px, -20px) scale(1.05);
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(-20px, 15px) scale(0.95);
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .blossom {
                animation: none;
                opacity: 0.5;
            }

            .hero-headline,
            .hero-subtext,
            .hero-cta,
            .hero-accent,
            .header {
                animation: none;
                opacity: 1;
                transform: none;
            }

            .hero-cta:hover {
                transform: none;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 1.2rem 1.5rem;
            }

            .header-nav {
                gap: 1.2rem;
            }

            .header-nav a {
                font-size: 0.78rem;
            }

            .hero-content {
                padding: 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem 1.5rem;
                background: rgba(45, 34, 38, 0.95);
                backdrop-filter: blur(10px);
            }

            .header-nav {
                gap: 0.8rem;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="#" class="header-logo">Dingdong</a>
        <nav>
            <ul class="header-nav">
                <li><a href="#">Home</a></li>
                <li><a href="#">학습 특장점</a></li>
                <li><a href="#">개설 강좌</a></li>
                <li><a href="#">뉴스레터</a></li>
                <li><a href="#">문의</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <!-- Floating blossom shapes -->
        <div class="blossom blossom-1"></div>
        <div class="blossom blossom-2"></div>
        <div class="blossom blossom-3"></div>
        <div class="blossom blossom-4"></div>
        <div class="blossom blossom-5"></div>
        <div class="blossom blossom-6"></div>

        <div class="hero-content">
            <span class="hero-accent"></span>
            <h1 class="hero-headline">중국어, 문화로 배우다</h1>
            <p class="hero-subtext">한국인을 위한 체계적인 중국어·중국 문화 교육 플랫폼</p>
            <a href="#" class="hero-cta">무료 체험 시작하기</a>
        </div>
    </section>

</body>
</html>
